services:
  backend:
    build: ./backend
    container_name: pharmacare-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      PORT: "5000"

  frontend:
    build: .
    container_name: pharmacare-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend